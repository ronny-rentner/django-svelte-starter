[dependency-groups]
main = [
  "django",
  "djangorestframework",
  "psycopg2-binary",
  "django-environ",
  "django-vite",
  "django-jazzmin",
  "django-countries",
  "django-select2",
  "django-cors-headers",
  "django-csp",
  "django-extensions",
  "requests",
  "whitenoise",
  "gunicorn",
  "google-genai",
  "youtube-transcript-api",
  "pytubefix",
  "ultraimport @ git+https://github.com/ronny-rentner/ultraimport@main",
  "ultraclick @ git+https://github.com/ronny-rentner/ultraclick@main",
  "djultra @ git+https://github.com/ronny-rentner/djultra@main",
]

[tool.isort]
profile = ""
src_paths = ["backend"]

[tool.autoimport.common_statements]
"np" = "import numpy as np"
"Q" = "from django.db.models import Q"
"F" = "from django.db.models import F"
"logger" = "import logging\nlogger = logging.getLogger(__name__)"
"serializers" = "from rest_framework import serializers"
"partial" = "from functools import partial"

[tool.ruff.lint]
